<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- PhotoCraft app icon, Arthavan Projects house style: a light glyph on a dark tile in the app's own tint.
       Original artwork drawn in code, MIT OR Apache-2.0 like the repository. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#233c4d"/>
      <stop offset="1" stop-color="#0a131a"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="4"/>
  <g fill="none" stroke="#98c4e1" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <rect x="104" y="128" width="304" height="256" rx="36" fill="#39637f" fill-opacity="0.35"/>
    <path d="M120 352 L210 250 L270 314 L314 270 L392 352" />
    <circle cx="322" cy="198" r="30" fill="#c2e0f4" stroke="none"/>
  </g>
  </g>
</svg>

# Fast checks on every pull request and every push to main: formatting, layering, the rebrand
# guard, the core crates' tests on Windows, a check that the desktop app builds
# there, and the app's own tests (control server, automation, engine, UI) on Linux.
# The full workspace suite (Clippy, every integration test, corpus, wasm, web, fuzz) runs nightly
# and on demand in ci-full.yml.
#
# Every action is pinned by commit SHA. Values from the event go through `env:`, never straight
# into a `run:` script.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # No test may print a page.
  PHOTOCRAFT_NO_PRINT: "1"
  LPDEST: photocraft-no-such-printer
  CARGO_PROFILE_DEV_DEBUG: "0"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      # This fork carries no ArtCraft marks or links and no storytold/craft-common-actions
      # workflows (house rules). LICENSE and NOTICE keep the upstream copyright line.
      - name: Rebrand guard
        run: |
          set -euo pipefail
          if git grep -nI 'craft-common-actions' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::storytold/craft-common-actions is not used in this fork"; exit 1
          fi
          if git grep -nIi -e 'getartcraft' -e 'discord\.gg/artcraft' -e 'api\.storyteller\.ai' -e 'ai\.storyteller\.photocraft' -- . ':!.github/workflows/ci.yml'; then
            echo "::error::ArtCraft/storyteller links or ids remain"; exit 1
          fi
          if [ -d docs/brand ]; then echo "::error::docs/brand (ArtCraft marks) must not exist"; exit 1; fi
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Dependency layering
        run: cargo xtask layers

  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # The document model, pixel and colour foundations and the file formats: the crates every
      # other part of the app stands on, and the ones whose behaviour can differ by platform.
      - name: Test core crates
        shell: bash
        run: >-
          cargo test --locked --lib --tests
          -p photocraft-geom -p photocraft-color -p photocraft-cms -p photocraft-raster
          -p photocraft-psd -p photocraft-codecs -p photocraft-doc -p photocraft-ops
          -p photocraft-format
      - name: Check the desktop app builds
        run: cargo check --locked -p photocraft --bins

  app:
    name: app tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Free disk space and install Linux system dependencies
        run: |
          nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL </dev/null >/dev/null 2>&1 &
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: app
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-nextest@0.9.146
      # The desktop app's unit tests (control server, single instance, CLI parsing) and the unit
      # tests of the automation, engine and UI crates. Integration tests run in ci-full.yml.
      - name: Test the app, automation, engine and UI
        run: >-
          cargo nextest run --profile ci --no-fail-fast --locked --lib --bins
          -p photocraft -p photocraft-automation -p photocraft-engine -p photocraft-ui-egui

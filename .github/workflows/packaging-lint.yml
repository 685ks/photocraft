# Quick static checks for the release pipeline (seconds, no Rust build): workflow syntax,
# packaging shell/PowerShell scripts, and the Linux desktop/AppStream/Flatpak metadata.
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    timeout-minutes: 10
    name: Desktop metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils libxml2-utils
      - name: Validate the desktop entry and XML metadata
        run: |
          set -euo pipefail
          desktop-file-validate packaging/linux/app.freedev.ainz.ks.PhotoCraft.desktop
          xmllint --noout packaging/linux/app.freedev.ainz.ks.PhotoCraft.metainfo.xml.in \
            packaging/linux/app.freedev.ainz.ks.PhotoCraft.mime.xml packaging/windows/photocraft.wxs \
            packaging/macos/Info.plist.in
          python3 -c 'import tomllib; d = tomllib.load(open("packaging/app.toml", "rb")); assert d["bundle_id"] == "app.freedev.ainz.ks.PhotoCraft", d'

  verified-appimage-inputs:
    timeout-minutes: 10
    name: Verified AppImage inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash packaging/linux/verified-download-test.sh
